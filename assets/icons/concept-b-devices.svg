<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 概念稿 B：跨设备加密链路</title>
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2128"/>
      <stop offset="1" stop-color="#0f1014"/>
    </linearGradient>
    <linearGradient id="b-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cf0a2"/>
      <stop offset="1" stop-color="#2fc974"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#b-bg)" stroke="#2b2f38" stroke-width="2"/>

  <!-- 内容整体下移，补偿底座造成的视觉重心偏上 -->
  <g transform="translate(0,18)">
    <!-- 链路：穿在两台设备之间，中段被锁压住 -->
    <path d="M112,113 H196" stroke="#71767f" stroke-width="6" fill="none"/>

    <!-- 左：桌面屏幕 + 底座 -->
    <rect x="24" y="62" width="106" height="76" rx="17" fill="#f2f4f8"/>
    <rect x="37" y="75" width="80" height="50" rx="9" fill="#15161a"/>
    <rect x="66" y="138" width="22" height="14" fill="#f2f4f8"/>
    <rect x="52" y="152" width="50" height="9" rx="4.5" fill="#f2f4f8"/>

    <!-- 右：手机 -->
    <rect x="180" y="60" width="52" height="101" rx="17" fill="#f2f4f8"/>
    <rect x="188" y="74" width="36" height="73" rx="9" fill="#15161a"/>

    <!-- 锁：先用底色拓一圈，把锁与两台设备分开 -->
    <path d="M142,103 V91 a13,13 0 0 1 26,0 V103" stroke="#15161a" stroke-width="18" stroke-linecap="round" fill="none"/>
    <rect x="127" y="98" width="56" height="44" rx="14" fill="#15161a"/>
    <path d="M142,101 V91 a13,13 0 0 1 26,0 V101" stroke="url(#b-accent)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="131" y="98" width="48" height="40" rx="12" fill="url(#b-accent)"/>
    <circle cx="155" cy="113" r="5.4" fill="#15161a"/>
    <rect x="152.6" y="114" width="4.8" height="12" rx="2.4" fill="#15161a"/>
  </g>
</svg>
