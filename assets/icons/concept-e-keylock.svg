<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 概念稿 E：视窗密钥</title>
  <defs>
    <linearGradient id="e-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F8"/>
    </linearGradient>
    <linearGradient id="e-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#e-bg)" stroke="#DCE1EA" stroke-width="2"/>

  <!-- 屏幕/通道：一整块蓝 -->
  <rect x="48" y="50" width="160" height="160" rx="36" fill="url(#e-blue)"/>

  <!-- 负空间锁孔 -->
  <circle cx="128" cy="120" r="30" fill="#FFFFFF"/>
  <path d="M110,136 L146,136 L128,178 Z" fill="#FFFFFF"/>
</svg>
