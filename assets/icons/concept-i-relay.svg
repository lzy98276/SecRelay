<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 概念稿 I：设备—中继—设备</title>
  <defs>
    <linearGradient id="i-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F8"/>
    </linearGradient>
    <linearGradient id="i-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#i-bg)" stroke="#DCE1EA" stroke-width="2"/>

  <!-- 链路 -->
  <rect x="74" y="120" width="32" height="16" rx="8" fill="url(#i-blue)"/>
  <rect x="150" y="120" width="32" height="16" rx="8" fill="url(#i-blue)"/>

  <!-- 两台设备 -->
  <rect x="32" y="106" width="44" height="44" rx="14" fill="#1E293B"/>
  <rect x="180" y="106" width="44" height="44" rx="14" fill="#1E293B"/>

  <!-- 中继节点：看得见转发，看不见内容 -->
  <rect x="102" y="102" width="52" height="52" rx="16" fill="url(#i-blue)"/>
  <circle cx="128" cy="120" r="11" fill="#FFFFFF"/>
  <path d="M119,129 L137,129 L128,147 Z" fill="#FFFFFF"/>
</svg>
