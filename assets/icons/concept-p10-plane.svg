<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 P10 · 单弧箭头，尾巴不再对着机头</title>
  <defs>
    <filter id="p10-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.18"/>
    </filter>
    <filter id="p10-ash" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B4A8C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 纸飞机：机身 126、翼展角 40°、俯冲 25° -->
  <g filter="url(#p10-sh)">
    <path d="M162,148 L66,53 L89,114 Z" fill="#78BAE6"/>
    <path d="M162,148 L89,114 L28,137 Z" fill="#127AD2"/>
  </g>

  <!-- 连接：独立放在机头右下方的单弧箭头，尾巴朝下、弧线甩向右上，不指向机头 -->
  <g filter="url(#p10-ash)">
    <path d="M168,185 C192,189 205,171 212,162" fill="none" stroke="#F2A33C" stroke-width="16" stroke-linecap="round"/>
    <path d="M228,141 L224.6,171.8 L199.4,152.2 Z" fill="#F2A33C"/>
  </g>
</svg>
