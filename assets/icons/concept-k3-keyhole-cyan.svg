<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 K3 · 实心锁孔 + 青蓝</title>
  <defs>
    <filter id="k3-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0B4A8C" flood-opacity="0.20"/>
    </filter>
    <filter id="k3-ash" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.26"/>
    </filter>
    <filter id="k3-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="k3-glow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" fill="#FFFFFF"/>
  <ellipse cx="174" cy="176" rx="84" ry="72" fill="url(#k3-glow)"/>

  <g filter="url(#k3-sh)">
    <rect x="110" y="44" width="62" height="82" rx="20" fill="#127AD2"/>
    <rect x="60" y="56" width="82" height="62" rx="20" fill="#78BAE6"/>
    <rect x="34" y="134" width="192" height="62" rx="31" fill="#127AD2"/>
  </g>

  <!-- 实心锁孔：体量比箭头大，16px 下更容易留住 -->
  <circle cx="174" cy="162" r="25" fill="#FFFFFF" filter="url(#k3-halo)"/>
  <path d="M155,172 L193,172 L174,214 Z" fill="#FFFFFF" filter="url(#k3-halo)"/>
  <circle cx="174" cy="162" r="25" fill="#22D3EE" filter="url(#k3-ash)"/>
  <path d="M155,172 L193,172 L174,214 Z" fill="#22D3EE" filter="url(#k3-ash)"/>
</svg>
