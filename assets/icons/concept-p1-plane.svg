<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 P1 · 折面纸飞机 + 弧形连接箭头</title>
  <defs>
    <filter id="p1-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.18"/>
    </filter>
    <filter id="p1-ash" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B4A8C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 纸飞机：机身一个折面，远翼一个折面，靠明暗差做出折叠的立体感 -->
  <g filter="url(#p1-sh)">
    <path d="M150,152 L74,58 L96,120 Z" fill="#78BAE6"/>
    <path d="M150,152 L96,120 L40,150 Z" fill="#127AD2"/>
  </g>

  <!-- 连接：一支带弧度的箭头，尾部圆头，体量小于飞机 -->
  <g filter="url(#p1-ash)">
    <path d="M152,214 C176,212 198,198 210,178" fill="none" stroke="#F2A33C" stroke-width="13" stroke-linecap="round"/>
    <path d="M210,178 L211.9,200.1 L189.5,186.7 Z" fill="#F2A33C"/>
  </g>
</svg>
