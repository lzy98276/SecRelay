<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 P9 · 加宽加大、贴近箭头、25° 俯冲（折中）</title>
  <defs>
    <filter id="p9-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.18"/>
    </filter>
    <filter id="p9-ash" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B4A8C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 纸飞机：机身 126、翼展角 40°、俯冲 25° -->
  <g filter="url(#p9-sh)">
    <path d="M162,147 L66,52 L89,113 Z" fill="#78BAE6"/>
    <path d="M162,147 L89,113 L28,136 Z" fill="#127AD2"/>
  </g>

  <!-- 连接：贴着机头的弧形箭头 -->
  <g filter="url(#p9-ash)">
    <path d="M178,175 Q197.9,210 214,187" fill="none" stroke="#F2A33C" stroke-width="16" stroke-linecap="round"/>
    <path d="M228,167 L227.1,196.2 L200.9,177.8 Z" fill="#F2A33C"/>
  </g>
</svg>
