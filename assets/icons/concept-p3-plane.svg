<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 P3 · 折面纸飞机 + 弧形连接箭头</title>
  <defs>
    <filter id="p3-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.18"/>
    </filter>
    <filter id="p3-ash" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B4A8C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 纸飞机：翼展角收到约 42°、机身拉长，两个折面分出远近 -->
  <g filter="url(#p3-sh)">
    <path d="M158,135 L70,44 L80,99 Z" fill="#78BAE6"/>
    <path d="M158,135 L80,99 L32,126 Z" fill="#127AD2"/>
  </g>

  <!-- 连接：弧形箭头，三角头明显，体量约为飞机的一半 -->
  <g filter="url(#p3-ash)">
    <path d="M162,205 C186,209 201,190 208,181" fill="none" stroke="#F2A33C" stroke-width="16" stroke-linecap="round"/>
    <path d="M224,160 L221,190 L195,171 Z" fill="#F2A33C"/>
  </g>
</svg>
