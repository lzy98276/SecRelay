<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 P7 · 纸飞机顺着箭头拐弯</title>
  <defs>
    <filter id="p7-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.18"/>
    </filter>
    <filter id="p7-ash" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B4A8C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 纸飞机：机身 132、翼展角 42°，机头压到 46° 俯冲，朝向和箭头入弯方向一致 -->
  <g filter="url(#p7-sh)">
    <path d="M156,170 L100,40 L97,109 Z" fill="#78BAE6"/>
    <path d="M156,170 L97,109 L28,110 Z" fill="#127AD2"/>
  </g>

  <!-- 连接：接着机头往右下扎、再甩向右上的弧线，尾圆头、三角头指向右上 -->
  <g filter="url(#p7-ash)">
    <path d="M174,178 Q198.4,225.7 214.3,200.1" fill="none" stroke="#F2A33C" stroke-width="16" stroke-linecap="round"/>
    <path d="M228,178 L227.9,208.6 L200.7,191.6 Z" fill="#F2A33C"/>
  </g>
</svg>
