<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 p5 · 折面纸飞机 + 弧形连接箭头（墨绿强调，与 SecRandom 同色）</title>
  <defs>
    <filter id="p5-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.18"/>
    </filter>
    <filter id="p5-ash" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B4A8C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 纸飞机：机身长 120、后缘 78、翼展角 36°，折线把远近两翼分开 -->
  <g filter="url(#p5-sh)">
    <path d="M160,129 L60,51 L87,102 Z" fill="#78BAE6"/>
    <path d="M160,129 L87,102 L34,125 Z" fill="#127AD2"/>
  </g>

  <!-- 连接：弧形箭头，三角头明显 -->
  <g filter="url(#p5-ash)">
    <path d="M160,197 C184,201 199,182 206,173" fill="none" stroke="#36AA75" stroke-width="16" stroke-linecap="round"/>
    <path d="M222,152 L218.8,182.6 L193.2,163.4 Z" fill="#36AA75"/>
  </g>
</svg>

