<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 概念稿 F：三流归一</title>
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F8"/>
    </linearGradient>
    <linearGradient id="f-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#f-bg)" stroke="#DCE1EA" stroke-width="2"/>

  <!-- 三路频道：媒体 / 文件 / 控制 -->
  <path d="M42,74 C74,74 88,100 102,120" fill="none" stroke="url(#f-blue)" stroke-width="14" stroke-linecap="round"/>
  <path d="M42,130 H104" fill="none" stroke="url(#f-blue)" stroke-width="14" stroke-linecap="round"/>
  <path d="M42,186 C74,186 88,160 102,140" fill="none" stroke="url(#f-blue)" stroke-width="14" stroke-linecap="round"/>

  <!-- 一条加密通道 -->
  <rect x="100" y="108" width="118" height="44" rx="22" fill="url(#f-blue)"/>
  <circle cx="180" cy="122" r="11" fill="#FFFFFF"/>
  <path d="M172,130 L188,130 L180,147 Z" fill="#FFFFFF"/>
</svg>
