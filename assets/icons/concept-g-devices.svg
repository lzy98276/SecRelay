<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 概念稿 G：双设备密钥</title>
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F8"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#g-bg)" stroke="#DCE1EA" stroke-width="2"/>

  <g transform="translate(0,14)">
    <!-- 左：桌面屏幕 + 底座 -->
    <rect x="32" y="68" width="100" height="70" rx="16" fill="#1E293B"/>
    <rect x="44" y="80" width="76" height="46" rx="8" fill="#FFFFFF"/>
    <rect x="72" y="138" width="20" height="12" fill="#1E293B"/>
    <rect x="58" y="150" width="48" height="9" rx="4.5" fill="#1E293B"/>

    <!-- 右：手机 -->
    <rect x="182" y="66" width="48" height="96" rx="16" fill="#1E293B"/>
    <rect x="189" y="78" width="34" height="72" rx="8" fill="#FFFFFF"/>

    <!-- 锁：先用白色拓一圈，把锁与两台设备分开 -->
    <path d="M143,112 V102 a14,14 0 0 1 28,0 V112" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <rect x="127" y="102" width="60" height="52" rx="17" fill="#FFFFFF"/>
    <path d="M143,110 V102 a14,14 0 0 1 28,0 V110" fill="none" stroke="url(#g-blue)" stroke-width="11" stroke-linecap="round"/>
    <rect x="135" y="108" width="44" height="36" rx="12" fill="url(#g-blue)"/>
    <circle cx="157" cy="122" r="6" fill="#FFFFFF"/>
    <rect x="154" y="124" width="6" height="13" rx="3" fill="#FFFFFF"/>
  </g>
</svg>
