<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 概念稿 D：S 通道（首字母）</title>
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2128"/>
      <stop offset="1" stop-color="#0f1014"/>
    </linearGradient>
    <linearGradient id="d-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cf0a2"/>
      <stop offset="1" stop-color="#2fc974"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#d-bg)" stroke="#2b2f38" stroke-width="2"/>

  <!-- S：一条弯折的通道。每个接点两侧控制点共线，保证折点处切线连续 -->
  <path d="M180,92 C180,64 156,50 130,50
           C100,50 80,66 80,90
           C80,112 100,122 130,128
           C160,134 180,146 180,168
           C180,192 158,208 130,208
           C104,208 80,196 76,176"
        fill="none" stroke="url(#d-accent)" stroke-width="30" stroke-linecap="round"/>
</svg>
