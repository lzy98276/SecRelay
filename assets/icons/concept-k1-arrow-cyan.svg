<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 K1 · 粗双向箭头 + 青蓝</title>
  <defs>
    <filter id="k1-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0B4A8C" flood-opacity="0.20"/>
    </filter>
    <filter id="k1-ash" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.26"/>
    </filter>
    <filter id="k1-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="k1-glow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" fill="#FFFFFF"/>
  <ellipse cx="173" cy="176" rx="84" ry="72" fill="url(#k1-glow)"/>

  <!-- 后面：手机（深蓝，被前面的屏幕咬掉左下） / 前面：屏幕（浅蓝） / 下面：通道 -->
  <g filter="url(#k1-sh)">
    <rect x="110" y="44" width="62" height="82" rx="20" fill="#127AD2"/>
    <rect x="60" y="56" width="82" height="62" rx="20" fill="#78BAE6"/>
    <rect x="34" y="134" width="192" height="62" rx="31" fill="#127AD2"/>
  </g>

  <!-- 双向箭头：粗到能当主角，向下右溢出主体 -->
  <path d="M216,146 L202.3,182.4 L197.1,175 L163.7,198.4 L168.9,205.8 L130,206 L143.7,169.6 L148.9,177 L182.3,153.6 L177.1,146.2 Z"
        fill="#FFFFFF" filter="url(#k1-halo)"/>
  <path d="M216,146 L202.3,182.4 L197.1,175 L163.7,198.4 L168.9,205.8 L130,206 L143.7,169.6 L148.9,177 L182.3,153.6 L177.1,146.2 Z"
        fill="#22D3EE" filter="url(#k1-ash)"/>
</svg>
