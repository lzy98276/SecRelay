<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 概念稿 H：S 管道</title>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F8"/>
    </linearGradient>
    <linearGradient id="h-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#h-bg)" stroke="#DCE1EA" stroke-width="2"/>

  <!-- 外壁 -->
  <path d="M180,92 C180,64 156,50 130,50
           C100,50 80,66 80,90
           C80,112 100,122 130,128
           C160,134 180,146 180,168
           C180,192 158,208 130,208
           C104,208 80,196 76,176"
        fill="none" stroke="url(#h-blue)" stroke-width="32" stroke-linecap="round"/>
  <!-- 内腔：让 S 读成一条中空的管道，而不是一个字母 -->
  <path d="M180,92 C180,64 156,50 130,50
           C100,50 80,66 80,90
           C80,112 100,122 130,128
           C160,134 180,146 180,168
           C180,192 158,208 130,208
           C104,208 80,196 76,176"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
</svg>
