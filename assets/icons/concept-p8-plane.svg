<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>SecRelay 图标 P8 · 加宽加大、贴近箭头、33° 俯冲</title>
  <defs>
    <filter id="p8-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4A8C" flood-opacity="0.18"/>
    </filter>
    <filter id="p8-ash" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B4A8C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 纸飞机：机身 126、翼展角 40°、俯冲 33°（P4 是 36°/18°，这版更宽更大更入弯） -->
  <g filter="url(#p8-sh)">
    <path d="M160,153 L79,46 L92,109 Z" fill="#78BAE6"/>
    <path d="M160,153 L92,109 L29,123 Z" fill="#127AD2"/>
  </g>

  <!-- 连接：从机头右下方接上，先沉后甩，弧度和飞机入弯方向一致 -->
  <g filter="url(#p8-ash)">
    <path d="M178,181 Q197.9,216 214,193" fill="none" stroke="#F2A33C" stroke-width="16" stroke-linecap="round"/>
    <path d="M228,173 L227.1,202.2 L200.9,183.8 Z" fill="#F2A33C"/>
  </g>
</svg>
