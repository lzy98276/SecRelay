[package]
name = "secrelay-theme"
description = "SecRelay 主题色：读取系统强调色（Windows / macOS / Linux），取不到则回退到内置默认色"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# 枚举系统已安装字体及其字重。选它是因为纯 Rust、跨平台，
# 而且能给出**每个族实际有哪些字重** —— 没有这个信息就没法避免"合成假粗体"。
fontdb = "0.24"
