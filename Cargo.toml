[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
# 主仓库当前是 GPLv3。是否改用 AGPLv3 尚未决定（见 docs/需求分析.md D23）。
license = "GPL-3.0-or-later"
repository = "https://github.com/lzy98276/SecRelay"

[workspace.dependencies]
secrelay-protocol = { path = "crates/secrelay-protocol" }
secrelay-transport = { path = "crates/secrelay-transport" }
secrelay-session = { path = "crates/secrelay-session" }
secrelay-i18n = { path = "crates/secrelay-i18n" }
secrelay-theme = { path = "crates/secrelay-theme" }
secrelay-relay-client = { path = "crates/secrelay-relay-client" }
secrelay-connection = { path = "crates/secrelay-connection" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
sha1 = "0.10"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
