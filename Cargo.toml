[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
# 主仓库当前是 GPLv3。是否改用 AGPLv3 尚未决定（见 docs/需求分析.md D23）。
license = "GPL-3.0-or-later"
repository = "https://github.com/lzy98276/SecRelay"

[workspace.dependencies]
secrelay-protocol = { path = "crates/secrelay-protocol" }
secrelay-transport = { path = "crates/secrelay-transport" }
secrelay-session = { path = "crates/secrelay-session" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
